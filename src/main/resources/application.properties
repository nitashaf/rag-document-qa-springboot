spring.application.name=rag-app
# Server
server.port=8080

# Ollama - points to your local Ollama instance
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=llama3.2
langchain4j.ollama.chat-model.temperature=0.7
langchain4j.ollama.chat-model.timeout=60s

# Ollama embedding model
#langchain4j.ollama.embedding-model.base-url=http://localhost:11434
#langchain4j.ollama.embedding-model.model-name=nomic-embed-text

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.neuroforge=DEBUG